<body>
    <!-- Landing: a stack of chapter folders -->
    <main class="landing" id="landing">

                <div class="rec-head"><span id="recNo">TITLE PAGE</span><span class="rec-ribbon" aria-hidden="true"></span></div>

                <footer><b id="recName"></b><span id="recSub"></span></footer>

            <nav class="folders" id="folders" aria-label="Portfolio folders"></nav>
        </div>

    <main class="chapter" id="chapter" hidden>
        <header class="topbar">
            <a href="#" class="back">&larr; ALL FOLDERS</a>

        </header>
        <article class="sheet" id="sheet">

            <div class="sheet-body" id="sheetBody"></div>
        </article>
        <nav class="pager" id="pager" aria-label="Chapters"></nav>
    </main>
